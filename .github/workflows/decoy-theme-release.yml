name: Release decoy system theme

on:
  push:
    branches: ['release/decoy-system-theme']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: decoy-system-theme-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag theme release source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Create immutable release tag
        env:
          TAG_REF: v8.19.2-4-memoly.13
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG_REF"; then
            test "$(git rev-parse "refs/tags/$TAG_REF^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$TAG_REF" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG_REF"
          fi

  release:
    name: Verify, sign and publish APK
    needs: tag
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: v8.19.2-4-memoly.13
      publish: true
    secrets: inherit
