name: PIN request race proof

on:
  workflow_dispatch:
  push:
    tags:
      - 'ci-pin-race-proof-*'

permissions:
  contents: read

jobs:
  prove:
    name: Compare .10 PIN request with fixed source
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/disk-cleanup
      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: 'true'
      - name: Require exact legacy failure then passing fixed regressions
        run: python3 .github/scripts/pin_race_proof.py
      - name: Save comparison logs and JUnit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pin-race-proof-${{ github.run_id }}
          path: pin-race-proof/
          if-no-files-found: error
